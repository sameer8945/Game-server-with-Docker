services:

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server

    ports:
       - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "1.21.10"
      MEMORY: "1G"
      ONLINE_MODE: "FALSE"

    volumes:
     - minecraft-data:/data

volumes:
  minecraft-data: